<style>
/* Layout: full-bleed 3D view. Instruments sit along the bottom edge like a coaming panel, warnings top-centre, one modal card for menu / pause / crash. Single committed look (daylight sky, amber instruments). */
:root{
  --bg:#0c1a22;
  --panel:rgba(10,22,30,.7);
  --line:rgba(214,232,238,.22);
  --text:#e8f1f3;
  --muted:#93acb4;
  --accent:#ffb347;
  --accent-ink:#1a1205;
  --warn:#ff5d4d;
  --ok:#74d6a4;
  --font-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-display);font-size:15px;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top>*{min-width:0}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mini{padding:7px 11px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mini b{font-family:var(--font-mono);font-weight:700;color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
.warn{align-self:flex-start;padding:8px 18px;border-radius:6px;background:var(--warn);color:#fff;font-weight:700;font-size:20px;letter-spacing:.2em}
.warn.blink{animation:blink .5s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.warn.blink{animation:none}}

.reads{display:flex;gap:18px;padding:10px 14px}
.read{display:flex;flex-direction:column;min-width:58px}
.read b{font-family:var(--font-mono);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.read span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
#ai{width:124px;height:124px;border-radius:50%;padding:0}
.gauge{display:flex;gap:12px;align-items:flex-end;padding:10px 12px}
.bar{width:14px;height:84px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:flex-end;background:rgba(255,255,255,.05);overflow:hidden}
.bar i{display:block;width:100%;background:var(--accent);height:0}
.gread{display:flex;flex-direction:column;gap:6px;min-width:64px}
.gread div{display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gread b{font-family:var(--font-mono);font-size:13px;color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
.lamp.on b{color:var(--accent)}

#overlay{position:absolute;inset:0;display:flex;overflow:auto;background:rgba(7,16,22,.58);
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:min(680px,100%);margin:auto;background:rgba(9,20,27,.92);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:14px}
.card h1{margin:0;font-size:46px;line-height:1;font-weight:700;letter-spacing:.02em}
.card h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sub{margin:0;color:var(--muted);font-size:16px;max-width:58ch;line-height:1.4}
.reason{margin:0;font-size:20px;line-height:1.3;max-width:50ch}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--font-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.keys{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:7px 16px;margin:0;font-size:14px;align-items:center}
.keys dt{display:flex;gap:4px;flex-wrap:wrap}
.keys dd{margin:0;color:var(--muted)}
kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:rgba(255,255,255,.07);color:var(--text)}
.tips{margin:0;padding:12px 14px;border-left:3px solid var(--accent);background:rgba(255,179,71,.08);font-size:14px;line-height:1.45;color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:15px;letter-spacing:.04em;padding:11px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:1 1 150px;text-align:left}
.opt small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.opt.on{border-color:var(--accent);background:rgba(255,179,71,.16)}
.mapcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mm{width:148px;height:148px;border-radius:50%;padding:0}
#apinfo{text-align:right}
@media (max-width:560px){#mm{width:112px;height:112px}}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn:disabled,.btn:disabled:hover{opacity:.5;cursor:not-allowed;filter:none}
.btn small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
#lock{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border:2px dashed var(--accent);border-radius:4px;pointer-events:none;color:var(--accent);font:700 12px var(--font-mono)}
#lock span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;white-space:nowrap;letter-spacing:.1em}
#lock.on{border-style:solid;border-color:var(--warn);color:var(--warn)}
#pip{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid var(--accent);border-radius:50%;opacity:.85;pointer-events:none}
.btn:hover{filter:brightness(1.08)}
.inp{font:inherit;font-size:15px;padding:11px 14px;border-radius:6px;border:1px solid var(--line);background:rgba(10,22,30,.6);color:var(--text);flex:1 1 160px;min-width:0}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mpstat{margin:0;font-size:13px;color:var(--muted);letter-spacing:.04em}
.mpstat.ok{color:var(--ok)}
#roster{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:60px;padding:8px 10px;min-width:150px;max-width:230px;font-size:13px;letter-spacing:.04em;text-transform:none;color:var(--text);white-space:normal}
#roster h3{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#roster div{display:flex;justify-content:space-between;gap:10px}
#roster div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#roster div b{font-family:var(--font-mono);font-weight:700}
#roster .me{color:var(--accent)}
#feed{position:absolute;left:50%;top:60px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#feed div{padding:4px 12px;border-radius:5px;background:var(--panel);border:1px solid var(--line);font-size:14px;white-space:nowrap}
#hurt{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 30px rgba(255,93,77,.65);opacity:0;transition:opacity .45s}
.kbnote{display:none;margin:0;color:var(--warn);font-size:14px}
@media (pointer:coarse){.kbnote{display:block}}
@media (max-width:560px){
  .reads{gap:12px;padding:8px 10px}
  .read b{font-size:20px}
  .read{min-width:48px}
  #ai{width:96px;height:96px}
  .card h1{font-size:38px}
}
#overlay.menu{padding:0;background:linear-gradient(90deg,rgba(6,14,20,.94) 0%,rgba(6,14,20,.8) 36%,rgba(6,14,20,.22) 64%,rgba(6,14,20,0) 80%),linear-gradient(0deg,rgba(6,14,20,.6),rgba(6,14,20,0) 38%)}
.home{width:min(600px,100%);box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.7vh,16px);
  padding-block:clamp(18px,4vh,40px);padding-left:max(clamp(16px,4vw,52px),env(safe-area-inset-left,0px));padding-right:clamp(16px,3vw,36px)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.brand{margin:0;font-size:clamp(56px,10vw,104px);line-height:.88;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.rwy{height:4px;width:min(340px,70%);background:repeating-linear-gradient(90deg,var(--accent) 0 28px,transparent 28px 46px)}
.tagline{margin:0;color:var(--muted);font-size:16px;line-height:1.4;max-width:46ch}
.home h2{margin:6px 0 0}
.fleet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ac{font:inherit;color:var(--text);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:8px;background:rgba(10,22,30,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);min-width:0}
.ac:hover{border-color:rgba(255,179,71,.6)}
.ac.on{border-color:var(--accent);background:rgba(255,179,71,.14);box-shadow:0 0 0 1px var(--accent) inset}
.ac b{font-size:21px;line-height:1;letter-spacing:.02em}
.ac .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ac .m{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.5}
.ac .m i{font-style:normal;color:var(--text)}
.meter{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meter span{width:44px;flex:none}
.meter em{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.12);flex:1;position:relative;overflow:hidden}
.meter em::after{content:"";position:absolute;inset:0;width:var(--v);background:var(--accent);border-radius:2px}
.blurb{margin:0;min-height:2.6em;font-size:15px;line-height:1.35;color:var(--text)}
.btn.big{font-size:17px;padding:13px 24px}
.how{border-top:1px solid var(--line);padding-top:10px}
.how summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.how[open] summary{color:var(--text)}
.how .tips{margin-top:12px}
.foot{margin:0;font-size:12px;color:var(--muted);letter-spacing:.06em}
.lnk{font:inherit;letter-spacing:.06em;background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);cursor:pointer;padding:2px 6px;margin-left:2px}
.lnk.on{color:var(--accent);border-bottom-color:var(--accent)}
.lnk:hover{color:var(--text)}
@media (max-width:820px){
  #overlay.menu{background:linear-gradient(180deg,rgba(6,14,20,.55),rgba(6,14,20,.9) 45%)}
  .home{justify-content:flex-end;margin:0 auto}
}
@media (max-width:560px){
  .fleet{grid-template-columns:1fr}
  .ac{flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px 12px}
  .ac .meter{display:none}
}
</style>

<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud" hidden>

</div>

(function(){

const V3=THREE.Vector3, Qn=THREE.Quaternion;

const PLANES=[
 {name:'Skylark',tag:'Light prop',desc:'Light trainer. Slow, forgiving, stalls near 80 km/h.',MASS:800,IX:1100,IY:1700,IZ:800,WING_S:14,SPAN:9.6,CHORD:1.5,A_STALL:0.30,T_STATIC:2800,P_MAX:75000,body:0xf4efe0,acc:0xc8372d,tip:0xf2a03d,
  vne:90,vcrash:115,agi:0.55,vAir:45,thrAir:0.36,cam:[0,3.2,12.5,-14],orb:[15,4],eye:[0,0.55,-0.7],bk:1,

 {name:'Jetliner',tag:'Twin-jet airliner',desc:'Big 737-class airliner. Heavy and steady, stalls near 180 km/h, needs most of the runway.',MASS:20000,IX:160000,IY:300000,IZ:300000,WING_S:80,SPAN:28,CHORD:3.0,A_STALL:0.25,T_STATIC:60000,P_MAX:6.5e6,body:0xf1f3f4,acc:0x1b4f9c,tip:0xf2a03d,
  cd0:0.028,wash:0,qref:6000,vne:150,vcrash:200,gcrash:5,agi:0.25,vAir:95,thrAir:0.3,cam:[0,9,40,-40],orb:[58,13],eye:[0,1.0,-13.2],bk:3.1,
  gear:{nose:[0,-3.3,-11],main:[3.2,-3.3,1.5],tail:[0,0.4,14.6]},

 {name:'Striker',tag:'Fighter jet',desc:'Fast, agile fighter with afterburner. G-limited. Stalls near 140 km/h.',MASS:7500,IX:90000,IY:110000,IZ:30000,WING_S:38,SPAN:11,CHORD:4.0,A_STALL:0.40,T_STATIC:80000,P_MAX:3.2e7,body:0x7a8791,acc:0x39444e,tip:0xd2392b,

];

function setPlane(i){
  const p=PLANES[i]; planeIdx=i;
  MASS=p.MASS; IX=p.IX; IY=p.IY; IZ=p.IZ; WING_S=p.WING_S; SPAN=p.SPAN; CHORD=p.CHORD; A_STALL=p.A_STALL; T_STATIC=p.T_STATIC; P_MAX=p.P_MAX;

const AIRPORTS=[{x:0,z:0,name:'Lowfly Field',tag:'L'},{x:0,z:-4000,name:'Northfield',tag:'N'}];   // both runways run north-south

function rawHeight(x,z){
  let m=1;
  for(let k=0;k<AIRPORTS.length;k++){const a=AIRPORTS[k], dz=Math.max(0,Math.abs(z-a.z)-650); m=Math.min(m,smooth(330,950,Math.hypot(x-a.x,dz)));}
  const v=noise(x,z)+0.12;
  const h=v>0?330*Math.pow(v,1.35):70*v;
  return (1-m)*RWY_Y+m*Math.max(h,-30);
}
const vh=(i,j)=>rawHeight(i*CELL,j*CELL);
/* Collision uses the same triangles the terrain mesh draws, so wheels sit on what you see. */
function terrainTri(x,z){
  const gx=x/CELL, gz=z/CELL, ix=Math.floor(gx), iz=Math.floor(gz), fx=gx-ix, fz=gz-iz;
  const h00=vh(ix,iz), h10=vh(ix+1,iz), h01=vh(ix,iz+1), h11=vh(ix+1,iz+1);
  if(fx+fz<=1) return h00+fx*(h10-h00)+fz*(h01-h00);
  return h11+(1-fx)*(h01-h11)+(1-fz)*(h10-h11);
}
let gWater=false;
function groundAt(x,z){
  const h=terrainTri(x,z);
  gWater=h<WATER_Y;
  if(gWater) return WATER_Y;
  if(onRunway(x,z)) return Math.max(h,RWY_Y+0.12);
  return h;
}
/* paved areas relative to each airport origin: [x0,x1,z0,z1] - runway, parallel taxiway, connectors, terminal apron, hangar apron */
const PAVED=[[-RWY_HALF_W,RWY_HALF_W,-RWY_HALF_L,RWY_HALF_L],[70,86,-560,560],[22,70,-568,-552],[22,70,-258,-242],[22,70,292,308],[22,70,552,568],[86,206,180,440],[-112,-22,310,400]];
function onRunway(x,z){
  for(let k=0;k<AIRPORTS.length;k++){
    const a=AIRPORTS[k], rx=x-a.x, rz=z-a.z;
    if(rx<-112||rx>206||rz<-610||rz>610) continue;
    for(let i=0;i<PAVED.length;i++){const r=PAVED[i]; if(rx>r[0]&&rx<r[1]&&rz>r[2]&&rz<r[3]) return true;}
  }
  return false;
}

/* ---- State ---- */
const hooks={crash:function(){}};
const st={pos:new V3(),vel:new V3(),q:new Qn(),w:new V3(),thr:0,trim:0,g:1,alpha:0,beta:0,speed:0,stall:0,onGround:false,time:0,dist:0,maxSpeed:0};
const ctl={pitch:0,roll:0,yaw:0,brake:false};   // pitch + = stick back (nose up), roll + = right, yaw + = right pedal

function resetState(kind){
  st.w.set(0,0,0); st.vel.set(0,0,0); st.trim=0; st.g=1; st.time=0; st.dist=0; st.maxSpeed=0; st.onGround=false; st.stall=0;
  ctl.pitch=0; ctl.roll=0; ctl.yaw=0; ctl.brake=false;
  if(kind==='air'){
    st.q.setFromAxisAngle(new V3(1,0,0),0.045);
    const pa=PLANES[planeIdx]; st.pos.set(AIRPORTS[startAp].x,620,AIRPORTS[startAp].z+320); st.vel.set(0,0,-pa.vAir); st.thr=pa.thrAir;
  }else{
    st.q.identity();
    st.pos.set(AIRPORTS[startAp].x,RWY_Y+0.12+GH-0.07,AIRPORTS[startAp].z+540); st.thr=0;
  }
}

const qInv=new Qn(), dq=new Qn(), vb=new V3(), vhat=new V3(), Fb=new V3(), ld=new V3(), Mb=new V3();
const Fw=new V3(), Fgear=new V3(), Tg=new V3(), wW=new V3(), rb=new V3(), rw=new V3(), Pw=new V3(), vp=new V3();
const fl=new V3(), sl=new V3(), Fg=new V3(), fb=new V3(), tq=new V3(), axis=new V3();

function step(dt){
  const q=st.q;
  qInv.copy(q).invert();
  vb.copy(st.vel).applyQuaternion(qInv);            // velocity through the air, in body axes
  const V=vb.length(), Vs=Math.max(V,10), moving=V>0.5;
  const alpha=moving?Math.atan2(-vb.y,-vb.z):0;
  const beta=moving?Math.asin(clamp(vb.x/V,-1,1)):0;
  st.alpha=alpha; st.beta=beta; st.speed=V;
  const sigma=Math.exp(-Math.max(st.pos.y,0)/8500), rho=1.225*sigma;
  const qd=0.5*rho*V*V;
  const thr=st.thr;
  const qc=0.5*rho*(V*V+Math.pow(WASH*thr,2)), qcE=Math.min(qc,QREF);         // control surfaces also sit in the prop wash

  /* lift and drag with a stall: attached-flow line blends into flat-plate behaviour past the stall angle */
  const s=smooth(A_STALL,A_STALL+0.10,Math.abs(alpha));
  const clAtt=clamp(CL0+CLA*alpha,CLMIN,CLMAX);
  const CL=lerp(clAtt,1.1*Math.sin(2*alpha),s);
  const sa=Math.sin(alpha), sb=Math.sin(beta);
  const CD=CD0+0.05*clAtt*clAtt+s*1.3*sa*sa+0.8*sb*sb;
  st.stall=s;

  Fb.set(0,0,0);
  if(moving){
    vhat.copy(vb).multiplyScalar(1/V);
    Fb.addScaledVector(vhat,-qd*WING_S*CD);
    ld.set(0,1,0).addScaledVector(vhat,-vhat.y);     // lift: perpendicular to the flight path, in the plane of symmetry
    const ll=ld.length();
    if(ll>1e-3) Fb.addScaledVector(ld,qd*WING_S*CL/ll);
  }
  Fb.x+=qd*WING_S*(-0.7*beta);                        // side force from sideslip
  Fb.z-=thr*Math.min(T_STATIC,P_MAX/Math.max(V,1))*Math.pow(sigma,0.7);

  /* moments */
  const wx=st.w.x, wy=st.w.y, wz=st.w.z, p=-wz, r=-wy;  // p roll rate (right +), r yaw rate (right +)
  let elev=clamp(ctl.pitch+st.trim,-1,1);
  if(GLIM>0){                                           // fly-by-wire G limiter
    if(elev>0) elev*=clamp((GLIM-st.g)/(GLIM*0.25),0,1);
    else if(elev<0) elev*=clamp((st.g+GLIM*0.35)/(GLIM*0.2),0,1);
  }
  const Mx=qd*WING_S*CHORD*(CM0+CMA*clamp(alpha,-0.9,0.9)+CMQ*(CHORD/(2*Vs))*wx-0.3*s*Math.sign(alpha))
          +qcE*WING_S*CHORD*CMDE*elev;
  const bq=qd*WING_S*SPAN, bc=qcE*WING_S*SPAN, bv=SPAN/(2*Vs);
  const Lr=bq*(CLP*(1-0.75*s)*bv*p+CLB*(1-4*s)*beta+CLR*bv*r)+bc*CLDA*ctl.roll;
  const Nr=bq*(CNB*beta+CNR*YD*bv*r)+bc*(CNDR*ctl.yaw+CNDA*ctl.roll);
  Mb.set(Mx,-Nr,-Lr);

  /* undercarriage: spring-damper at each wheel plus tyre friction */
  Fgear.set(0,0,0); Tg.set(0,0,0); st.onGround=false;
  wW.copy(st.w).applyQuaternion(q);
  const steer=ctl.yaw*0.45;
  for(let i=0;i<gearDefs.length;i++){
    const gd=gearDefs[i];
    rb.copy(gd.p); rw.copy(rb).applyQuaternion(q); Pw.copy(st.pos).add(rw);
    const gh=groundAt(Pw.x,Pw.z), comp=gh-Pw.y;
    if(comp<=0) continue;
    if(gWater && comp>0.3){ hooks.crash('The plane ditched in the water.'); return; }
    st.onGround=true;
    vp.crossVectors(wW,rw).add(st.vel);
    let N=gd.k*comp+gd.c*(-vp.y); if(N<0) N=0; if(N>NMAX) N=NMAX;
    if(gd.steer) fl.set(Math.sin(steer),0,-Math.cos(steer)); else fl.set(0,0,-1);
    fl.applyQuaternion(q); fl.y=0;
    const fLen=fl.length(); if(fLen<1e-3) fl.set(0,0,-1); else fl.multiplyScalar(1/fLen);
    sl.set(-fl.z,0,fl.x);
    const vf=vp.x*fl.x+vp.z*fl.z, vs=vp.x*sl.x+vp.z*sl.z;
    const mur=onRunway(Pw.x,Pw.z)?0.025:0.08;
    const Ff=(ctl.brake&&gd.brake)?-clamp(vf*6000*GK,-0.55*N,0.55*N):-clamp(vf*3000*GK,-mur*N,mur*N);
    const Fs=-clamp(vs*7000*GK,-N,N);
    Fg.set(fl.x*Ff+sl.x*Fs,N,fl.z*Ff+sl.z*Fs);
    Fgear.add(Fg);
    fb.copy(Fg).applyQuaternion(qInv);
    tq.crossVectors(rb,fb); Tg.add(tq);
  }

  /* total force and the G the pilot would feel */
  Fw.copy(Fb).applyQuaternion(q); Fw.y-=MASS*G; Fw.add(Fgear);
  fb.copy(Fgear).applyQuaternion(qInv);
  st.g+=((Fb.y+fb.y)/(MASS*G)-st.g)*Math.min(1,dt*10);

  /* integrate: linear (world) then angular (Euler's equations in body axes) */
  st.vel.addScaledVector(Fw,dt/MASS);
  st.pos.addScaledVector(st.vel,dt);
  st.w.x+=((Mb.x+Tg.x-(IZ-IY)*wy*wz)/IX)*dt;
  st.w.y+=((Mb.y+Tg.y-(IX-IZ)*wz*wx)/IY)*dt;
  st.w.z+=((Mb.z+Tg.z-(IY-IX)*wx*wy)/IZ)*dt;
  st.w.x=clamp(st.w.x,-6,6); st.w.y=clamp(st.w.y,-6,6); st.w.z=clamp(st.w.z,-6,6);
  const wl=st.w.length();
  if(wl>1e-6){ axis.copy(st.w).multiplyScalar(1/wl); dq.setFromAxisAngle(axis,wl*dt); q.multiply(dq).normalize(); }

  st.time+=dt; st.dist+=Math.hypot(st.vel.x,st.vel.z)*dt; if(V>st.maxSpeed) st.maxSpeed=V;

  if(!isFinite(st.pos.x+st.pos.y+st.pos.z+st.q.w)){ resetState('air'); return; }
  if(st.g>GCRASH||st.g<-GCRASH*0.5||V>VCRASH){ hooks.crash('The wings failed. The airframe was overloaded.'); return; }
  for(let i=0;i<hitPts.length;i++){
    Pw.copy(hitPts[i].p).applyQuaternion(q).add(st.pos);
    const gh=groundAt(Pw.x,Pw.z);
    if(Pw.y<gh){ hooks.crash(gWater?'The plane ditched in the water.':hitPts[i].msg); return; }
  }
}

/* terrain: flat-shaded triangles, rebuilt around the plane whenever it crosses a cell */
const NC=100, NV=NC+1;
const hCache=new Float32Array(NV*NV);
const tPos=new Float32Array(NC*NC*18), tNor=new Float32Array(NC*NC*18), tCol=new Float32Array(NC*NC*18);
const tGeo=new THREE.BufferGeometry();
tGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3));
tGeo.setAttribute('normal',new THREE.BufferAttribute(tNor,3));
tGeo.setAttribute('color',new THREE.BufferAttribute(tCol,3));
const tMesh=new THREE.Mesh(tGeo,new THREE.MeshLambertMaterial({vertexColors:true}));
tMesh.frustumCulled=false; tMesh.receiveShadow=true; scene.add(tMesh);
const cSand=new THREE.Color(0xd7c58f), cGrassA=new THREE.Color(0x74a24f), cGrassB=new THREE.Color(0x4d8949),
      cRock=new THREE.Color(0x8b8c86), cSnow=new THREE.Color(0xeff3f5), cSea=new THREE.Color(0x24566a), cMeadow=new THREE.Color(0x9fac58), cDeep=new THREE.Color(0x3c7242), tmpC=new THREE.Color();
function colorFor(h,ny,r,out,wx,wz){
  if(h<WATER_Y) out.copy(cSea);
  else if(h<7) out.copy(cSand).lerp(cGrassA,smooth(2,7,h));
  else if(h<90) out.copy(cGrassA).lerp(cGrassB,smooth(7,90,h));
  else if(h<190) out.copy(cGrassB).lerp(cRock,smooth(90,190,h));
  else out.copy(cRock).lerp(cSnow,smooth(230,300,h));
  if(h>=3&&h<150){                       // patchwork of meadow and darker woodland ground
    const v=Math.sin(wx*0.0063+Math.sin(wz*0.0041)*2.0)*Math.sin(wz*0.0057-wx*0.0031+1.0);
    if(v>0.25) out.lerp(cMeadow,smooth(0.25,0.8,v)*0.55); else if(v<-0.35) out.lerp(cDeep,smooth(-0.35,-0.85,v)*0.45);
  }
  const sl=smooth(0.92,0.72,ny); if(sl>0&&h>10) out.lerp(cRock,sl*0.75);
  out.multiplyScalar(0.92+0.16*r);
}
function hash2(a,b){const s=Math.sin(a*127.1+b*311.7)*43758.5453; return s-Math.floor(s);}
let wo=0;
function tri(ax,ay,az,bx,by,bz,cx,cy,cz,r){
  const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;
  let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
  const l=Math.hypot(nx,ny,nz)||1; nx/=l; ny/=l; nz/=l;
  colorFor((ay+by+cy)/3,ny,r,tmpC,(ax+bx+cx)/3,(az+bz+cz)/3);
  const P=[ax,ay,az,bx,by,bz,cx,cy,cz];
  for(let k=0;k<3;k++){
    tPos[wo]=P[k*3]; tPos[wo+1]=P[k*3+1]; tPos[wo+2]=P[k*3+2];
    tNor[wo]=nx; tNor[wo+1]=ny; tNor[wo+2]=nz;
    tCol[wo]=tmpC.r; tCol[wo+1]=tmpC.g; tCol[wo+2]=tmpC.b;
    wo+=3;
  }
}
let tcx=1e9, tcz=1e9;
function updateTerrain(cx,cz){
  tcx=cx; tcz=cz; wo=0;
  const i0=cx-NC/2, j0=cz-NC/2;
  for(let j=0;j<NV;j++) for(let i=0;i<NV;i++) hCache[j*NV+i]=vh(i0+i,j0+j);
  for(let j=0;j<NC;j++) for(let i=0;i<NC;i++){
    const x0=(i0+i)*CELL, x1=x0+CELL, z0=(j0+j)*CELL, z1=z0+CELL;
    const h00=hCache[j*NV+i], h10=hCache[j*NV+i+1], h01=hCache[(j+1)*NV+i], h11=hCache[(j+1)*NV+i+1];
    tri(x0,h00,z0, x0,h01,z1, x1,h10,z0, hash2(i0+i,j0+j));
    tri(x1,h10,z0, x0,h01,z1, x1,h11,z1, hash2(j0+j+17,i0+i-5));
  }
  tGeo.attributes.position.needsUpdate=true;
  tGeo.attributes.normal.needsUpdate=true;
  tGeo.attributes.color.needsUpdate=true;
}

function updateWater(cx,cz,t){                 // gentle world-space waves on a grid that snaps to the camera so the facets stay put
  const px=Math.round(cx/WCELL)*WCELL, pz=Math.round(cz/WCELL)*WCELL, p=waterGeo.attributes.position;
  water.position.x=px; water.position.z=pz;
  for(let i=0;i<p.count;i++){
    const wx=p.getX(i)+px, wz=-p.getY(i)+pz;
    p.setZ(i,0.8*Math.sin(wx*0.0141+t*0.9)*Math.cos(wz*0.0113-t*0.7)+0.45*Math.sin((wx+wz)*0.027-t*1.3));
  }
  p.needsUpdate=true;
}

/* ---------- aircraft model helpers. Nose points to -Z, +Y up. ---------- */
const HEXA=[[0,1,2],[0,2,3],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7]];
function solid(verts,faces,m){            // flat-shaded convex solid; triangles are re-wound so normals face outward
  let cx=0,cy=0,cz=0; verts.forEach(function(v){cx+=v[0];cy+=v[1];cz+=v[2];}); const n=verts.length; cx/=n; cy/=n; cz/=n;
  const pos=[];
  faces.forEach(function(f){
    const a=verts[f[0]]; let b=verts[f[1]], c=verts[f[2]];
    const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const mx=(a[0]+b[0]+c[0])/3-cx, my=(a[1]+b[1]+c[1])/3-cy, mz=(a[2]+b[2]+c[2])/3-cz;
    if(nx*mx+ny*my+nz*mz<0){const t=b; b=c; c=t;}
    pos.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);
  });
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.computeVertexNormals();
  return new THREE.Mesh(g,m);
}
function hexa(v,m){return solid(v,HEXA,m);}
/* tapered, swept wing panel. side=+1/-1; x0,x1 are distances from the centreline, zLE the leading-edge z, c the chord, yb the underside, t the thickness */
function wingPanel(side,x0,zLE0,c0,x1,zLE1,c1,yb0,yb1,t0,t1,m){
  const X0=side*x0, X1=side*x1;
  return hexa([[X0,yb0,zLE0],[X0,yb0,zLE0+c0],[X1,yb1,zLE1+c1],[X1,yb1,zLE1],
               [X0,yb0+t0,zLE0],[X0,yb0+t0,zLE0+c0],[X1,yb1+t1,zLE1+c1],[X1,yb1+t1,zLE1]],m);
}
/* thin vertical fin: base and top given as [yb,zLE,zTE] / [yt,zLE,zTE] */
function finPanel(half,b,t,m){
  const A=-half, B=half;
  return hexa([[A,b[0],b[1]],[A,b[0],b[2]],[A,t[0],t[2]],[A,t[0],t[1]],[B,b[0],b[1]],[B,b[0],b[2]],[B,t[0],t[2]],[B,t[0],t[1]]],m);

function spawnDebris(){
  for(let i=0;i<26;i++){
    const m=new THREE.Mesh(dGeo,dMats[i%4]);
    m.scale.set(0.3+Math.random()*0.8,0.15+Math.random()*0.3,0.3+Math.random()*0.8);

    m.userData.v=st.vel.clone().multiplyScalar(0.3).add(new V3((Math.random()-0.5)*14,3+Math.random()*9,(Math.random()-0.5)*14));
    m.userData.s=new V3((Math.random()-0.5)*8,(Math.random()-0.5)*8,(Math.random()-0.5)*8);
    scene.add(m); debris.push(m);
  }
}
function updateDebris(dt){
  for(let i=0;i<debris.length;i++){
    const d=debris[i], v=d.userData.v;
    if(v.lengthSq()<0.01&&d.userData.rest) continue;
    v.y-=9.8*dt; d.position.addScaledVector(v,dt);
    d.rotation.x+=d.userData.s.x*dt; d.rotation.y+=d.userData.s.y*dt; d.rotation.z+=d.userData.s.z*dt;
    const gh=groundAt(d.position.x,d.position.z)+0.15;
    if(d.position.y<gh){ d.position.y=gh; v.set(0,0,0); d.userData.s.set(0,0,0); d.userData.rest=true; }
  }
}

function readInputs(dt){
  const k=c=>keys.has(c);
  let p=((k('KeyS')||k('ArrowDown'))?1:0)-((k('KeyW')||k('ArrowUp'))?1:0); if(invert) p=-p;
  const r=((k('KeyD')||k('ArrowRight'))?1:0)-((k('KeyA')||k('ArrowLeft'))?1:0);
  const y=(k('KeyE')?1:0)-(k('KeyQ')?1:0);
  ctl.pitch=approach(ctl.pitch,p*0.5,(p?2:4)*dt);
  ctl.roll=approach(ctl.roll,r*0.7,(r?3:5)*dt);
  ctl.yaw=approach(ctl.yaw,y*0.8,(y?3:5)*dt);
  ctl.brake=k('Space')||k('KeyB');

}

/* puffs: smoke, muzzle flash and explosions share one ring-buffer pool */
const smokeM=new THREE.MeshBasicMaterial({color:0xd8dde0,transparent:true,opacity:0.6,depthWrite:false});
const fireM=new THREE.MeshBasicMaterial({color:0xffa03a,transparent:true,opacity:0.9,depthWrite:false});
const fxGeo=new THREE.IcosahedronGeometry(1,0), fxPool=[]; let fxI=0;
for(let i=0;i<240;i++){ const m=new THREE.Mesh(fxGeo,smokeM); m.visible=false; scene.add(m); fxPool.push({m:m,life:0,max:1,a:1,b:1}); }
const fxTmp=new V3();
function fx(p,fire,a,b,life){
  const o=fxPool[fxI]; fxI=(fxI+1)%fxPool.length;
  o.m.material=fire?fireM:smokeM; o.m.position.copy(p); o.life=life; o.max=life; o.a=a; o.b=b; o.m.scale.setScalar(a); o.m.visible=true;
}
function explode(p,size){
  for(let k=0;k<5;k++){ fxTmp.set(p.x+(Math.random()-0.5)*size*0.5,p.y+(Math.random()-0.5)*size*0.5,p.z+(Math.random()-0.5)*size*0.5); fx(fxTmp,true,size*0.3,size,0.55+Math.random()*0.2); }
  for(let k=0;k<5;k++){ fxTmp.set(p.x+(Math.random()-0.5)*size,p.y+(Math.random()-0.5)*size*0.6,p.z+(Math.random()-0.5)*size); fx(fxTmp,false,size*0.4,size*1.5,1.6+Math.random()*0.8); }
}
function updateFx(dt){
  for(let i=0;i<fxPool.length;i++){
    const o=fxPool[i]; if(!o.m.visible) continue;
    o.life-=dt; if(o.life<=0){ o.m.visible=false; continue; }
    const t=1-o.life/o.max;
    o.m.scale.setScalar((o.a+(o.b-o.a)*t)*(1-0.7*t*t));
    if(o.m.material===smokeM) o.m.position.y+=dt*2;
  }
}

/* target drones: orbit fixed circles, respawn after being shot down */
const TGT_CFG=[[300,-900,700,420,65],[-1100,-1800,900,560,80],[1000,-2300,800,380,70],[-300,-3200,700,500,75],[1400,-4200,900,640,85],[-1400,-5000,800,450,70],[900,1100,900,560,75],[-1300,-100,800,620,70]];
const tgtBodyM=pm(0xf2a03d,50), tgtWingM=pm(0xf2f2ee,40), tgtTailM=pm(0xc8372d,40);
const targets=TGT_CFG.map(function(c,i){
  const g=new THREE.Group();
  const body=mesh(new THREE.IcosahedronGeometry(1,1),tgtBodyM,0,0,0); body.scale.set(2.2,2.2,5.5); g.add(body);
  g.add(mesh(new THREE.BoxGeometry(15,0.35,2.8),tgtWingM,0,0.2,0.4));
  g.add(mesh(new THREE.BoxGeometry(5.5,0.3,1.6),tgtWingM,0,0.2,4.6));
  g.add(mesh(new THREE.BoxGeometry(0.3,3.2,1.8),tgtTailM,0,1.8,4.6));
  g.add(mesh(new THREE.BoxGeometry(0.4,0.4,9),tgtTailM,0,3.2,0.5));
  scene.add(g);
  return {g:g,cx:c[0],cz:c[1],rad:c[2],alt:c[3],spd:c[4],w:c[4]/c[2],a:i*0.9,ph:i*0.9,alive:true,hp:100,rs:0,pos:new V3(c[0]+c[2],c[3],c[1]),v:new V3()};
});
function updateTargets(dt){
  for(let i=0;i<targets.length;i++){
    const t=targets[i];
    if(!t.alive){ t.rs-=dt; if(t.rs<=0){ t.alive=true; t.hp=100; t.g.visible=true; } continue; }
    t.a=t.ph+(t.w*((Date.now()+NET.off)/1000))%6.283185307;   // phase comes from a shared clock so every pilot sees the drones in the same place
    const s=Math.sin(t.a), c=Math.cos(t.a);
    t.pos.set(t.cx+c*t.rad, t.alt+Math.sin(t.a*0.7)*30, t.cz+s*t.rad);
    t.v.set(-s*t.spd,0,c*t.spd);
    t.g.position.copy(t.pos); t.g.rotation.y=Math.atan2(-t.v.x,-t.v.z);
  }
}
function killTarget(t,remote){
  t.alive=false; t.rs=10; t.g.visible=false;
  if(!remote){ kills++; netSend({t:'tk',i:targets.indexOf(t)}); }
  explode(t.pos,16);
}

/* weapon state */
let gunLeft=0, mslLeft=0, kills=0, gunT=0, gunIdx=0, lockT=0, lockTgt=null, lockR=0, hp=100, firing=false;
const msls=[];
const wV=new V3(), wF=new V3(), wR=new V3(), wD=new V3(), wA=new V3(), sd1=new V3(), sd2=new V3();
function segDist2(a,b,c){
  sd1.subVectors(b,a); const l2=sd1.lengthSq(); let t=0;
  if(l2>1e-9){ sd2.subVectors(c,a); t=clamp(sd2.dot(sd1)/l2,0,1); }
  sd2.copy(a).addScaledVector(sd1,t); return sd2.distanceToSquared(c);
}
function resetWeapons(){
  const W=WEAPONS[planeIdx];
  gunLeft=W.ammo; mslLeft=MSL_COUNT; kills=0; hp=100; firing=false; gunT=0; gunIdx=0; lockT=0; lockTgt=null;
  bullets.length=0; bulletIM.count=0; bulletIM.instanceMatrix.needsUpdate=true;
  while(msls.length){ scene.remove(msls.pop().g); }
  for(let i=0;i<fxPool.length;i++) fxPool[i].m.visible=false;
  pylons.forEach(function(ps){ ps.forEach(function(m){ m.visible=true; }); });
  targets.forEach(function(t){ t.alive=true; t.hp=100; t.g.visible=true; });
}
function fireGun(W){
  const gp=W.guns[gunIdx++%W.guns.length];
  const b={p:new V3(gp[0],gp[1],gp[2]).applyQuaternion(st.q).add(st.pos),pp:new V3(),v:new V3(),l:2.2,own:true};
  wF.set(0,0,-1).applyQuaternion(st.q);
  b.v.copy(st.vel).addScaledVector(wF,GUN_V);
  b.v.x+=(Math.random()-0.5)*3; b.v.y+=(Math.random()-0.5)*3; b.v.z+=(Math.random()-0.5)*3;
  if(bullets.length>=BMAX) bullets.shift();
  bullets.push(b); gunLeft--;
  fx(b.p,true,0.5*W.ms+0.3,1.1*W.ms+0.6,0.07);
}
function fireMissile(){
  if(mode!=='play'||mslLeft<=0) return;
  const W=WEAPONS[planeIdx], slot=MSL_COUNT-mslLeft; mslLeft--;
  pylons[planeIdx][slot].visible=false;
  const sp=W.msl[slot], g=makeMissile(W.ms,true);
  const m={g:g,p:new V3(sp[0],sp[1]-0.3,sp[2]).applyQuaternion(st.q).add(st.pos),pp:new V3(),v:new V3(),
    tgt:(lockTgt&&lockT>=LOCK_T)?lockTgt:null,age:0,smk:0,maxS:Math.max(320,st.vel.length()+180),mid:++NET.mid};
  wF.set(0,0,-1).applyQuaternion(st.q);
  m.v.copy(st.vel).addScaledVector(wF,30); m.v.y-=3;
  scene.add(g); g.position.copy(m.p); msls.push(m);
  netSend({t:'msl',mid:m.mid,p:[m.p.x,m.p.y,m.p.z],v:[m.v.x,m.v.y,m.v.z]});
}
function endMissile(i){ scene.remove(msls[i].g); msls[i]=msls[msls.length-1]; msls.pop(); }
function updateWeapons(dt){
  const W=WEAPONS[planeIdx];
  buildTL();
  if(mode==='play'){
    gunT-=dt;
    firing=(keys.has('KeyG')||keys.has('Mouse0'))&&gunLeft>0;
    if(firing){
      const iv=1/W.rate;
      while(gunT<=0&&gunLeft>0){ gunT+=iv; fireGun(W); }
    }else gunT=Math.max(gunT,0);
    /* lock-on: best target inside a 25 degree cone ahead */
    wF.set(0,0,-1).applyQuaternion(st.q);
    let best=null, bs=0.9063, br=0;
    for(let i=0;i<tl.length;i++){
      const t=tl[i]; if(!t.alive) continue;
      wR.subVectors(t.pos,st.pos); const r=wR.length();
      if(r>40&&r<LOCK_RANGE){ const c=wR.dot(wF)/r; if(c>bs){ bs=c; best=t; br=r; } }
    }
    if(best&&best===lockTgt) lockT=Math.min(lockT+dt,LOCK_T+0.01); else { lockTgt=best; lockT=0; }
    lockR=br;
  }else{ lockTgt=null; lockT=0; firing=false; }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.pp.copy(b.p); b.v.y-=9.81*dt; b.p.addScaledVector(b.v,dt); b.l-=dt;
    let dead=b.l<=0;
    if(!dead){
      for(let k=0;k<tl.length;k++){
        const t=tl[k]; if(!b.own||!t.alive) continue;          // only the shooter judges hits; other pilots' tracers are just visuals
        if(segDist2(b.pp,b.p,t.pos)<(t.peer?t.r2:64)){
          fx(b.p,true,1.2,3,0.15); dead=true;
          if(t.peer) t.acc+=5; else { t.hp-=12; if(t.hp<=0) killTarget(t); }
          break;
        }
      }
    }
    if(!dead&&b.p.y<groundAt(b.p.x,b.p.z)){ dead=true; fx(b.p,false,0.8,2.5,0.5); }
    if(dead){ bullets[i]=bullets[bullets.length-1]; bullets.pop(); }
  }
  for(let i=0;i<bullets.length;i++){
    const b=bullets[i];
    bDir.copy(b.v).normalize();
    bDummy.position.copy(b.p); bDummy.quaternion.setFromUnitVectors(WZ,bDir); bDummy.updateMatrix();
    bulletIM.setMatrixAt(i,bDummy.matrix);
  }
  bulletIM.count=bullets.length; bulletIM.instanceMatrix.needsUpdate=true;

  for(let i=msls.length-1;i>=0;i--){
    const m=msls[i];
    m.age+=dt; m.pp.copy(m.p);
    const sp0=Math.max(m.v.length(),1);
    let sp=clamp(sp0+(m.age<4?140*dt:-8*dt),60,m.maxS);
    wD.copy(m.v).multiplyScalar(1/sp0);
    if(m.tgt&&m.tgt.alive&&m.age>0.3){
      wR.subVectors(m.tgt.pos,m.p); const r=wR.length();
      wA.copy(m.tgt.pos).addScaledVector(m.tgt.v,Math.min(r/sp,6)*0.8).sub(m.p).normalize();
      const ang=Math.acos(clamp(wD.dot(wA),-1,1));
      if(ang>1e-4){ wR.crossVectors(wD,wA); if(wR.lengthSq()>1e-10){ wR.normalize(); wD.applyAxisAngle(wR,Math.min(ang,2.6*dt)); } }
    }
    m.v.copy(wD).multiplyScalar(sp); m.v.y-=9.81*dt;
    m.p.addScaledVector(m.v,dt);
    m.g.position.copy(m.p); m.g.quaternion.setFromUnitVectors(WZ,wD.copy(m.v).normalize());
    m.smk-=dt; if(m.smk<=0&&m.age<5){ m.smk=0.04; wR.copy(wD).multiplyScalar(-2).add(m.p); fx(wR,false,0.5,1.8,1.2); }
    let boom=false;
    if(m.age>0.25){
      for(let k=0;k<tl.length;k++){
        const t=tl[k]; if(!t.alive) continue;
        if(segDist2(m.pp,m.p,t.pos)<256){ if(t.peer) t.acc+=70; else { t.hp=0; killTarget(t); } boom=true; break; }
      }
      if(!boom&&m.p.y<groundAt(m.p.x,m.p.z)){ explode(m.p,9); boom=true; }
    }
    if(boom||m.age>12){
      if(!boom) fx(m.p,false,1,4,1);
      netSend({t:'mend',mid:m.mid,p:[m.p.x,m.p.y,m.p.z],b:boom?1:0});
      endMissile(i);
    }
  }
  updateFx(dt);
}

/* lock box and gun pipper, projected onto the screen */
const lockEl=$('lock'), pipEl=$('pip'), lkV=new V3(), lkF=new V3();
function updateLockUI(){
  if(mode!=='play'){ lockEl.hidden=true; pipEl.hidden=true; return; }
  const w=canvas.clientWidth||window.innerWidth, h=canvas.clientHeight||window.innerHeight;
  camera.updateMatrixWorld();
  lkF.set(0,0,-1).applyQuaternion(st.q);
  lkV.copy(st.pos).addScaledVector(lkF,700).project(camera);
  if(lkV.z<1){ pipEl.hidden=false; pipEl.style.transform='translate('+((lkV.x*0.5+0.5)*w).toFixed(1)+'px,'+((-lkV.y*0.5+0.5)*h).toFixed(1)+'px)'; } else pipEl.hidden=true;
  if(lockTgt){
    lkV.copy(lockTgt.pos).project(camera);
    if(lkV.z<1){
      const locked=lockT>=LOCK_T;
      lockEl.hidden=false; lockEl.className=locked?'on':'';
      lockEl.style.transform='translate('+((lkV.x*0.5+0.5)*w).toFixed(1)+'px,'+((-lkV.y*0.5+0.5)*h).toFixed(1)+'px)';
      lockEl.lastElementChild.textContent=(lockTgt.peer?lockTgt.name+' ':'')+(locked?'LOCK ':'')+(lockR/1000).toFixed(1)+' km';
      return;
    }
  }
  lockEl.hidden=true;
}

/* ================= Multiplayer =================
   Every pilot flies their own physics locally and streams state (about 15 per second) through the server.
   Other pilots are drawn as interpolated aircraft with name tags. The shooter decides whether a bullet or
   missile hit, tells the victim, and the victim applies the damage. Target drones use a shared clock. */
const NET={ws:null,id:0,name:'',myName:'',want:false,state:'off',off:0,peers:new Map(),roster:[],sendT:0,mid:0,rm:new Map(),tries:0,timer:0,url:''};
try{NET.name=localStorage.getItem('lowfly-name')||'';}catch(e){}
const PEERCOL=[0x2d9cdb,0x27ae60,0x9b59b6,0xe67e22,0xe84393,0x16a085,0xf1c40f,0xe74c3c];
const PEER_R2=[49,196,64], PEER_BH=[3,8,4];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tl=[];
function buildTL(){ tl.length=0; for(let i=0;i<targets.length;i++) tl.push(targets[i]); NET.peers.forEach(function(p){ if(p.alive) tl.push(p); }); }

function netUrl(){
  let q=null; try{ q=new URLSearchParams(location.search).get('server'); }catch(e){}
  if(q) return q;
  if(location.protocol==='file:'||!location.host) return 'ws://localhost:8080/ws';
  return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
}
function netSend(o){ const w=NET.ws; if(w&&w.readyState===1&&NET.state==='on') w.send(JSON.stringify(o)); }
function netName(){
  let n=String(NET.name||'').replace(/[^\p{L}\p{N} _.\-]/gu,'').replace(/\s+/g,' ').trim().slice(0,16);
  if(!n) n='Pilot'+(100+Math.floor(Math.random()*900));
  NET.name=n; try{localStorage.setItem('lowfly-name',n);}catch(e){}
}
function mpText(){
  if(NET.state==='on'){ const n=NET.roster.length; return 'Online as '+NET.myName+' · '+n+(n===1?' pilot':' pilots')+' connected'; }
  if(NET.state==='connecting') return 'Connecting…';
  if(NET.state==='retry') return 'Could not reach the server. Retrying…';
  return 'Offline. Go online to fly with other pilots.';
}
function netStat(){
  const s=$('mpstat'); if(s){ s.textContent=mpText(); s.className='mpstat'+(NET.state==='on'?' ok':''); }
  renderRoster();
}
function netConnect(){ NET.want=true; NET.tries=0; NET.url=netUrl(); openSocket(); }
function openSocket(){
  clearTimeout(NET.timer);
  if(NET.ws){ const old=NET.ws; NET.ws=null; try{old.close();}catch(e){} }
  NET.state='connecting'; netStat();
  let ws;
  try{ ws=new WebSocket(NET.url); }catch(e){ NET.state='retry'; netStat(); NET.timer=setTimeout(openSocket,3000); return; }
  NET.ws=ws;
  ws.onopen=function(){ ws.send(JSON.stringify({t:'hello',name:NET.name,plane:planeIdx})); };
  ws.onmessage=function(e){ let m; try{ m=JSON.parse(e.data); }catch(x){ return; } if(m&&typeof m.t==='string') netMsg(m); };
  ws.onclose=function(){
    if(NET.ws!==ws) return;
    NET.ws=null; netClear();
    if(NET.want){ NET.state='retry'; netStat(); NET.timer=setTimeout(openSocket,Math.min(8000,1500*(++NET.tries))); }
    else{ NET.state='off'; netStat(); }
  };
  ws.onerror=function(){};
}
function netDisconnect(){
  NET.want=false; clearTimeout(NET.timer);
  const w=NET.ws; NET.ws=null; if(w){ try{w.close();}catch(e){} }
  NET.state='off'; netClear(); netStat();
}
function netClear(){
  NET.peers.forEach(removePeer); NET.peers.clear();
  NET.rm.forEach(function(r){ scene.remove(r.g); }); NET.rm.clear();
  NET.roster=[]; NET.id=0; renderRoster();
}

function getPeer(id){
  let p=NET.peers.get(id); if(p) return p;
  p={id:id,name:'Pilot',score:0,plane:-1,m:null,g:null,pos:new V3(),rpos:new V3(),q:new Qn(),rq:new Qn(),v:new V3(),c:[0,0,0,0],f:0,t:0,gunT:0,gi:0,
     alive:false,peer:true,acc:0,r2:49,bh:4,tag:null,tagCv:document.createElement('canvas'),col:PEERCOL[id%PEERCOL.length]};
  p.tagCv.width=256; p.tagCv.height=64;
  p.tag=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(p.tagCv),transparent:true,depthWrite:false,fog:false,toneMapped:false}));
  p.tag.renderOrder=5; p.tag.frustumCulled=false; p.tag.visible=false; scene.add(p.tag);
  drawTag(p); NET.peers.set(id,p); return p;
}
function drawTag(p){
  const c=p.tagCv, x=c.getContext('2d'); x.clearRect(0,0,256,64);
  x.font='700 30px "Barlow Semi Condensed","Arial Narrow",sans-serif'; x.textBaseline='middle';
  const w=Math.min(244,x.measureText(p.name).width+46), x0=128-w/2, r=10;
  x.fillStyle='rgba(8,18,24,.74)'; x.beginPath();
  x.moveTo(x0+r,10); x.arcTo(x0+w,10,x0+w,54,r); x.arcTo(x0+w,54,x0,54,r); x.arcTo(x0,54,x0,10,r); x.arcTo(x0,10,x0+w,10,r); x.closePath(); x.fill();
  x.fillStyle='#'+('000000'+p.col.toString(16)).slice(-6); x.beginPath(); x.arc(x0+19,32,7,0,Math.PI*2); x.fill();
  x.fillStyle='#ffffff'; x.fillText(p.name,x0+34,33,w-44);
  p.tag.material.map.needsUpdate=true;
}
function setPeerPlane(p,i){
  if(p.g) scene.remove(p.g);
  const P=PLANES[i], M=fixedMats(P.body,p.col,p.col);
  p.m=i===0?makeSkylark(M):i===1?makeJetliner(M):makeFighter(M);
  p.g=p.m.g; p.g.traverse(function(o){ if(o.isMesh) o.castShadow=true; }); p.g.visible=false; scene.add(p.g);
  p.plane=i; p.r2=PEER_R2[i]; p.bh=PEER_BH[i];
}
function removePeer(p){
  if(p.g) scene.remove(p.g);
  scene.remove(p.tag); if(p.tag.material.map) p.tag.material.map.dispose(); p.tag.material.dispose();
}
const fin=n=>typeof n==='number'&&isFinite(n);
function peerState(p,m){
  if(!Number.isInteger(m.p)||m.p<0||m.p>2||!fin(m.x)||!fin(m.y)||!fin(m.z)) return;
  if(!Array.isArray(m.q)||m.q.length!==4||!Array.isArray(m.v)||m.v.length!==3||!Array.isArray(m.c)||m.c.length!==4) return;
  if(p.plane!==m.p) setPeerPlane(p,m.p);
  p.rpos.set(m.x,m.y,m.z); p.rq.set(m.q[0],m.q[1],m.q[2],m.q[3]).normalize(); p.v.set(m.v[0],m.v[1],m.v[2]);
  p.c=[+m.c[0]||0,+m.c[1]||0,+m.c[2]||0,+m.c[3]||0]; p.f=m.f?1:0; p.t=performance.now();
  if(!p.alive){ p.alive=true; p.pos.copy(p.rpos); p.q.copy(p.rq); }
}
function netMsg(m){
  switch(m.t){
    case 'welcome':
      NET.id=m.id; NET.myName=String(m.name||NET.name); NET.off=(+m.now||Date.now())-Date.now(); NET.state='on'; NET.tries=0; netStat(); break;
    case 'roster': {
      if(!Array.isArray(m.list)) break;
      NET.roster=m.list; const seen=new Set();
      m.list.forEach(function(r){
        if(r.id===NET.id) return;
        seen.add(r.id);
        const p=getPeer(r.id), nm=String(r.name||'Pilot');
        if(p.name!==nm){ p.name=nm; drawTag(p); }
        p.score=r.score|0;
      });
      NET.peers.forEach(function(p,id){ if(!seen.has(id)){ removePeer(p); NET.peers.delete(id); } });
      netStat(); break;
    }
    case 's': { const p=NET.peers.get(m.id); if(p) peerState(p,m); break; }
    case 'out': { const p=NET.peers.get(m.id); if(p){ if(p.alive&&m.boom) explode(p.pos,14); p.alive=false; } break; }
    case 'msl': {
      const p=NET.peers.get(m.id); if(!p||p.plane<0||!Array.isArray(m.p)||!Array.isArray(m.v)||!Number.isInteger(m.mid)) break;
      const g=makeMissile(WEAPONS[p.plane].ms,true), r={g:g,p:new V3(m.p[0],m.p[1],m.p[2]),v:new V3(m.v[0],m.v[1],m.v[2]),age:0,smk:0};
      g.position.copy(r.p); scene.add(g); NET.rm.set(m.id+'/'+m.mid,r); break;
    }
    case 'mend': {
      const k=m.id+'/'+m.mid, r=NET.rm.get(k);
      if(r){ scene.remove(r.g); NET.rm.delete(k); if(m.b&&Array.isArray(m.p)) explode(new V3(m.p[0],m.p[1],m.p[2]),9); }
      break;
    }
    case 'hit': netHit(m); break;
    case 'tk': { const t=targets[m.i]; if(t&&t.alive) killTarget(t,true); break; }
    case 'feed': addFeed(String(m.text||'')); break;
  }
}
function netHit(m){
  if(mode!=='play'||!fin(m.d)) return;
  hp-=m.d;
  const h=$('hurt'); if(h){ h.style.opacity=1; setTimeout(function(){ h.style.opacity=0; },120); }
  if(hp<=0){
    hp=0;
    const by=NET.peers.get(m.from);
    netSend({t:'died',by:m.from});
    onCrash('You were shot down by '+(by?esc(by.name):'another pilot')+'.');
  }
}

const pTgt=new V3(), rmD=new V3();
function peerGun(p,W){
  const gp=W.guns[p.gi++%W.guns.length];
  const b={p:new V3(gp[0],gp[1],gp[2]).applyQuaternion(p.q).add(p.pos),pp:new V3(),v:new V3(),l:2.2,own:false};
  wF.set(0,0,-1).applyQuaternion(p.q);
  b.v.copy(p.v).addScaledVector(wF,GUN_V);
  b.v.x+=(Math.random()-0.5)*3; b.v.y+=(Math.random()-0.5)*3; b.v.z+=(Math.random()-0.5)*3;
  if(bullets.length>=BMAX) bullets.shift();
  bullets.push(b);
  fx(b.p,true,0.5*W.ms+0.3,1.1*W.ms+0.6,0.07);
}
function updatePeers(dt){
  if(!NET.peers.size&&!NET.rm.size) return;
  const now=performance.now(), sim=(mode==='play'||mode==='crashed');
  NET.peers.forEach(function(p){
    if(p.alive&&now-p.t>4000) p.alive=false;                       // stopped sending: paused, left, or lost connection
    if(!p.alive||!p.m){ if(p.g) p.g.visible=false; p.tag.visible=false; return; }
    const age=Math.min((now-p.t)/1000,0.4);
    pTgt.copy(p.rpos).addScaledVector(p.v,age);
    p.pos.lerp(pTgt,1-Math.exp(-dt*14));
    p.q.slerp(p.rq,1-Math.exp(-dt*12));
    p.g.visible=true; p.g.position.copy(p.pos); p.g.quaternion.copy(p.q);
    const m=p.m, c=p.c, e=clamp(c[0],-1,1);
    m.elev.rotation.x=-m.ek*e;
    m.ailR.rotation.x=-0.5*c[1]/0.7; m.ailL.rotation.x=0.5*c[1]/0.7;
    m.rud.rotation.y=-0.45*c[2]/0.8;
    if(m.prop) m.prop.rotation.z+=(40+c[3]*170)*dt;
    if(m.glow){ const on=c[3]>0.03; m.glow.visible=on; if(on){ m.glow.scale.set(1,0.25+c[3]*(c[3]>0.85?1.9:1.1)+Math.random()*0.12,1); m.glow.position.z=9.0+m.glow.scale.y*1.6; } }
    const d=camera.position.distanceTo(p.pos);
    if(d>12&&d<9000){
      const sc=d*0.026; p.tag.visible=true;
      p.tag.position.set(p.pos.x,p.pos.y+p.bh+d*0.012,p.pos.z); p.tag.scale.set(sc*4,sc,1);
    }else p.tag.visible=false;
    if(sim&&p.f){
      const W=WEAPONS[p.plane], iv=1/W.rate; p.gunT-=dt; let n=0;
      while(p.gunT<=0&&n++<4){ p.gunT+=iv; peerGun(p,W); }
    }else p.gunT=0;
  });
  if(sim){
    NET.rm.forEach(function(r,k){                                  // other pilots' missiles: visual only, the owner decides what they hit
      r.age+=dt;
      const sp0=Math.max(r.v.length(),1), sp=Math.min(sp0+(r.age<4?140*dt:-8*dt),400);
      rmD.copy(r.v).multiplyScalar(1/sp0); r.v.copy(rmD).multiplyScalar(sp); r.v.y-=9.81*dt;
      r.p.addScaledVector(r.v,dt); r.g.position.copy(r.p); r.g.quaternion.setFromUnitVectors(WZ,rmD.copy(r.v).normalize());
      r.smk-=dt; if(r.smk<=0&&r.age<5){ r.smk=0.04; rmD.copy(r.v).normalize().multiplyScalar(-2).add(r.p); fx(rmD,false,0.5,1.8,1.2); }
      if(r.age>14||r.p.y<groundAt(r.p.x,r.p.z)){ scene.remove(r.g); NET.rm.delete(k); }
    });
  }
}
function netTick(dt){
  if(NET.state!=='on'||mode!=='play') return;
  NET.sendT-=dt; if(NET.sendT>0) return; NET.sendT=1/15;
  const r=(n,d)=>Math.round(n*d)/d;
  netSend({t:'s',p:planeIdx,x:r(st.pos.x,100),y:r(st.pos.y,100),z:r(st.pos.z,100),
    q:[r(st.q.x,1e4),r(st.q.y,1e4),r(st.q.z,1e4),r(st.q.w,1e4)],v:[r(st.vel.x,10),r(st.vel.y,10),r(st.vel.z,10)],
    c:[r(clamp(ctl.pitch+st.trim,-1,1),100),r(ctl.roll,100),r(ctl.yaw,100),r(st.thr,100)],f:firing?1:0});
  NET.peers.forEach(function(p){ if(p.acc>0){ netSend({t:'hit',to:p.id,d:Math.min(100,Math.round(p.acc))}); p.acc=0; } });
}
function netSpawnOffset(kind){                                      // spread pilots out so they do not all start on the same spot
  if(NET.state!=='on') return;
  const k=(NET.id%7)-3;
  if(kind==='ground'){ st.pos.x+=k*5; st.pos.z-=(NET.id%4)*20; }
  else{ st.pos.x+=k*60; st.pos.y+=k*20; }
}
function renderRoster(){
  const el=$('roster'); if(!el) return;
  if(NET.state!=='on'){ el.hidden=true; return; }
  el.hidden=false; el.textContent='';
  const h=document.createElement('h3'); h.textContent='Pilots online · '+NET.roster.length; el.appendChild(h);
  NET.roster.slice().sort(function(a,b){ return (b.score|0)-(a.score|0); }).slice(0,8).forEach(function(r){
    const row=document.createElement('div'); if(r.id===NET.id) row.className='me';
    const n=document.createElement('span'); n.textContent=r.name; const s=document.createElement('b'); s.textContent=r.score|0;
    row.appendChild(n); row.appendChild(s); el.appendChild(row);
  });
}
function addFeed(text){
  const f=$('feed'); if(!f||!text) return;
  const d=document.createElement('div'); d.textContent=text; f.appendChild(d);
  while(f.children.length>4) f.removeChild(f.firstChild);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },7000);
}

/* ================= Per-frame sync ================= */
let propAngle=0, shadowOn=true;
function syncPlane(dt){
  plane.position.copy(st.pos); plane.quaternion.copy(st.q);
  const cur=models[planeIdx], e=clamp(ctl.pitch+st.trim,-1,1);
  cur.elev.rotation.x=-cur.ek*e;
  cur.ailR.rotation.x=-0.5*ctl.roll/0.7; cur.ailL.rotation.x=0.5*ctl.roll/0.7;
  cur.rud.rotation.y=-0.45*ctl.yaw/0.8;
  if(mode==='play'||mode==='paused'){ propAngle+=(40+st.thr*170)*dt*(mode==='play'?1:0); }
  if(cur.prop) cur.prop.rotation.z=propAngle;
  if(cur.glow){ const on=(mode==='play'||mode==='paused')&&st.thr>0.03; cur.glow.visible=on; if(on){ cur.glow.scale.set(1,0.25+st.thr*(st.thr>0.85?1.9:1.1)+Math.random()*0.12,1); cur.glow.position.z=9.0+cur.glow.scale.y*1.6; } }
  const gh=groundAt(st.pos.x,st.pos.z);
  blob.position.set(st.pos.x,gh+0.2,st.pos.z);
  const h=Math.max(0,st.pos.y-gh); const sc=(1+h/90)*PLANES[planeIdx].bk; blob.scale.set(sc,sc,sc);
  blob.material.opacity=Math.max(0.06,0.3-h/1200);
  blob.visible=!gWater&&!gfxHigh;
}
function setFov(f){ if(Math.abs(f-fovNow)>0.01){ fovNow=f; camera.fov=f; camera.updateProjectionMatrix(); } }
let orbitA=0.6;
function updateCamera(dt){
  const P=PLANES[planeIdx];
  if(mode==='menu'){                                   // slow turntable around the parked aircraft
    plane.visible=true; setFov(48); orbitA+=dt*0.16;
    camera.up.set(0,1,0);
    camera.position.set(st.pos.x+Math.sin(orbitA)*P.orb[0],st.pos.y+P.orb[1]+Math.sin(orbitA*0.7)*1.5,st.pos.z+Math.cos(orbitA)*P.orb[0]);
    camera.lookAt(st.pos.x,st.pos.y+P.orb[1]*0.12,st.pos.z);
    camQ.copy(st.q);
  }else if(view==='cockpit'){
    plane.visible=false; blob.visible=blob.visible; setFov(78);
    camera.position.set(P.eye[0],P.eye[1],P.eye[2]).applyQuaternion(st.q).add(st.pos);
    camera.quaternion.copy(st.q);
  }else{
    plane.visible=true; setFov(62+clamp(st.speed/VNE,0,1)*9);
    camQ.slerp(st.q,1-Math.exp(-dt*3.5));
    desired.set(P.cam[0],P.cam[1],P.cam[2]).applyQuaternion(camQ).add(st.pos);
    camera.position.lerp(desired,1-Math.exp(-dt*9));
    const floor=groundAt(camera.position.x,camera.position.z)+2.5;
    if(camera.position.y<floor) camera.position.y=floor;
    tmpUp.set(0,1,0).applyQuaternion(camQ);
    upv.set(0,1,0).lerp(tmpUp,0.45).normalize();
    camera.up.copy(upv);
    look.set(0,1,P.cam[3]).applyQuaternion(camQ).add(st.pos);
    camera.lookAt(look);
  }
  scene.userData.sky.position.copy(camera.position);
  updateWater(camera.position.x,camera.position.z,performance.now()/1000);
  sunSprite.position.copy(camera.position).addScaledVector(sunDir,8000);
  sun.position.copy(st.pos).addScaledVector(sunDir,600); sun.target.position.copy(st.pos);
  const cx=Math.round(st.pos.x/CELL), cz=Math.round(st.pos.z/CELL);
  if(cx!==tcx||cz!==tcz) updateTerrain(cx,cz);
  if(Math.hypot(camera.position.x-trX,camera.position.z-trZ)>350) rebuildTrees(camera.position.x,camera.position.z);
  for(let i=0;i<clouds.length;i++){
    const c=clouds[i];
    if(c.position.x-camera.position.x>4500) c.position.x-=9000; else if(c.position.x-camera.position.x<-4500) c.position.x+=9000;
    if(c.position.z-camera.position.z>4500) c.position.z-=9000; else if(c.position.z-camera.position.z<-4500) c.position.z+=9000;
  }
}

/* ================= HUD ================= */
const el={hdg:$('hdg'),g:$('gl-g'),aoa:$('aoa'),spd:$('spd'),alt:$('alt'),vs:$('vs'),thr:$('thr'),trim:$('trim'),fill:$('thrfill'),
  brk:$('brk'),gnd:$('gnd'),warn:$('warn'),view:$('viewlbl'),gun:$('gunN'),msl:$('mslN'),kills:$('kills'),hp:$('hpN')};
const ai=$('ai'), aic=ai.getContext('2d');
let aiSize=0;
function sizeAI(){
  const dpr=Math.min(window.devicePixelRatio||1,2), css=ai.clientWidth||124;
  aiSize=Math.round(css*dpr); ai.width=aiSize; ai.height=aiSize;
}
function drawAI(pitch,roll){
  const W=aiSize; if(!W) return;
  aic.save(); aic.clearRect(0,0,W,W); aic.translate(W/2,W/2);
  aic.beginPath(); aic.arc(0,0,W/2-2,0,Math.PI*2); aic.clip();
  aic.rotate(-roll);
  const ppr=(W/2)/0.62;                       // pixels per radian of pitch
  aic.translate(0,pitch*ppr);
  aic.fillStyle='#4a86b8'; aic.fillRect(-W*2,-W*3,W*4,W*3);
  aic.fillStyle='#7a5c3a'; aic.fillRect(-W*2,0,W*4,W*3);
  aic.strokeStyle='#f4f7f8'; aic.lineWidth=Math.max(1,W/70); aic.fillStyle='#f4f7f8';
  aic.beginPath(); aic.moveTo(-W,0); aic.lineTo(W,0); aic.stroke();
  aic.font=Math.round(W/12)+'px "JetBrains Mono",monospace'; aic.textAlign='center'; aic.textBaseline='middle';
  for(let d=-30;d<=30;d+=10){
    if(d===0) continue;
    const y=-d*Math.PI/180*ppr, hw=d%20===0?W*0.16:W*0.1;
    aic.beginPath(); aic.moveTo(-hw,y); aic.lineTo(hw,y); aic.stroke();
    if(d%20===0) aic.fillText(String(Math.abs(d)),hw+W*0.08,y);
  }
  aic.restore();
  aic.save(); aic.translate(W/2,W/2);
  aic.strokeStyle='#ffb347'; aic.lineWidth=Math.max(2,W/36); aic.lineCap='round';
  aic.beginPath(); aic.moveTo(-W*0.34,0); aic.lineTo(-W*0.12,0); aic.lineTo(-W*0.12,W*0.06);
  aic.moveTo(W*0.34,0); aic.lineTo(W*0.12,0); aic.lineTo(W*0.12,W*0.06); aic.stroke();
  aic.fillStyle='#ffb347'; aic.beginPath(); aic.arc(0,0,W*0.025,0,Math.PI*2); aic.fill();
  aic.restore();
}
const mm=$('mm'), mmc=mm.getContext('2d'), apinfo=$('apinfo');
const MR=3000, MN=44, mmImg=document.createElement('canvas'), mmd=(mmImg.width=mmImg.height=MN,mmImg.getContext('2d').createImageData(MN,MN));
let mmS=0, mmCx=1e9, mmCz=0;
function sizeMM(){ const d=Math.min(window.devicePixelRatio||1,2), c=mm.clientWidth||148; mmS=Math.round(c*d); mm.width=mmS; mm.height=mmS; mmCx=1e9; }
function mmTerrain(px,pz){
  for(let j=0;j<MN;j++) for(let i=0;i<MN;i++){
    const h=rawHeight(px+((i+0.5)/MN*2-1)*MR, pz+((j+0.5)/MN*2-1)*MR); let r,g,b;
    if(h<WATER_Y){r=36;g=86;b=106;} else if(h<90){const t=h/90; r=150-80*t; g=185-45*t; b=100-25*t;} else if(h<200){r=122;g=126;b=116;} else {r=236;g=241;b=243;}
    const o=(j*MN+i)*4; mmd.data[o]=r; mmd.data[o+1]=g; mmd.data[o+2]=b; mmd.data[o+3]=255;
  }
  mmImg.getContext('2d').putImageData(mmd,0,0);
}
function drawMap(hdgDeg){
  if(!mmS) return;
  const hr=hdgDeg*Math.PI/180, ch=Math.cos(hr), sh=Math.sin(hr), W=mmS, s=(W/2)/MR, c=mmc, px=st.pos.x, pz=st.pos.z;
  if(Math.hypot(px-mmCx,pz-mmCz)>350){ mmCx=px; mmCz=pz; mmTerrain(px,pz); }
  c.save(); c.clearRect(0,0,W,W); c.translate(W/2,W/2);
  c.beginPath(); c.arc(0,0,W/2-1,0,Math.PI*2); c.clip();
  c.rotate(-hr); c.imageSmoothingEnabled=true;
  c.drawImage(mmImg,(mmCx-px-MR)*s,(mmCz-pz-MR)*s,2*MR*s,2*MR*s);
  c.strokeStyle='#ffb347'; c.lineWidth=Math.max(2,W/48); c.lineCap='round';
  for(let k=0;k<AIRPORTS.length;k++){ const a=AIRPORTS[k], x=(a.x-px)*s, y=(a.z-pz)*s; c.beginPath(); c.moveTo(x,y-RWY_HALF_L*s); c.lineTo(x,y+RWY_HALF_L*s); c.stroke(); }
  c.restore();
  c.save(); c.translate(W/2,W/2); c.font='700 '+Math.round(W/11)+'px '+getComputedStyle(document.body).fontFamily; c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='#e8f1f3'; c.fillText('N',-sh*(W/2-W/11),-ch*(W/2-W/11));
  let near=null, nd=1e12;
  for(let k=0;k<AIRPORTS.length;k++){
    const a=AIRPORTS[k], dx=a.x-px, dz=a.z-pz, d=Math.hypot(dx,dz); if(d<nd){nd=d; near=a; near.brg=(Math.atan2(dx,-dz)*180/Math.PI+360)%360;}
    const sx=dx*ch+dz*sh, sy=-dx*sh+dz*ch, rr=W/2-W/8;
    let x=sx*s, y=sy*s; const dd=Math.hypot(x,y); if(dd>rr){ x*=rr/dd; y*=rr/dd; }
    c.fillStyle='#ffb347'; c.fillText(a.tag,x+(dd>rr?0:W/12),y-(dd>rr?0:W/14));
    if(dd>rr){ c.beginPath(); c.arc(x,y,W/36,0,Math.PI*2); c.fill(); }
  }
  for(let k=0;k<targets.length;k++){
    const t=targets[k]; if(!t.alive) continue;
    const dx=t.pos.x-px, dz=t.pos.z-pz, x=(dx*ch+dz*sh)*s, y=(-dx*sh+dz*ch)*s;
    if(Math.hypot(x,y)<W/2-5){ c.fillStyle='#ff5d4d'; c.beginPath(); c.arc(x,y,W/45,0,Math.PI*2); c.fill(); }
  }
  NET.peers.forEach(function(p){
    if(!p.alive) return;
    const dx=p.pos.x-px, dz=p.pos.z-pz; let x=(dx*ch+dz*sh)*s, y=(-dx*sh+dz*ch)*s; const dd=Math.hypot(x,y), rr=W/2-5;
    if(dd>rr){ x*=rr/dd; y*=rr/dd; }
    c.fillStyle='#'+('000000'+p.col.toString(16)).slice(-6); c.strokeStyle='#0c1a22'; c.lineWidth=1.5; c.beginPath(); c.arc(x,y,W/38,0,Math.PI*2); c.fill(); c.stroke();
  });
  c.fillStyle='#fff'; c.strokeStyle='#0c1a22'; c.lineWidth=2; c.beginPath(); c.moveTo(0,-W/16); c.lineTo(W/22,W/20); c.lineTo(0,W/32); c.lineTo(-W/22,W/20); c.closePath(); c.fill(); c.stroke();
  c.restore();
  apinfo.textContent=near.name+' '+(nd/1000).toFixed(1)+' km '+String(Math.round(near.brg)%360).padStart(3,'0')+'\u00b0';
}
let hudTick=0;
function updateHud(){
  tmpF.set(0,0,-1).applyQuaternion(st.q); tmpR.set(1,0,0).applyQuaternion(st.q); tmpUp.set(0,1,0).applyQuaternion(st.q);
  const pitch=Math.asin(clamp(tmpF.y,-1,1)), roll=Math.atan2(-tmpR.y,tmpUp.y);
  let hdg=Math.atan2(tmpF.x,-tmpF.z)*180/Math.PI; if(hdg<0) hdg+=360;
  drawAI(pitch,roll);
  if((hudTick++%2)) return;
  drawMap(hdg);
  const agl=st.pos.y-GH-groundAt(st.pos.x,st.pos.z);
  el.hdg.textContent=String(Math.round(hdg)%360).padStart(3,'0');
  el.g.textContent=st.g.toFixed(1);
  el.aoa.textContent=(st.alpha*180/Math.PI).toFixed(0);
  el.spd.textContent=Math.round(st.vel.length()*3.6);
  el.alt.textContent=Math.round(st.pos.y);
  el.vs.textContent=(st.vel.y>=0?'+':'')+st.vel.y.toFixed(1);
  el.thr.textContent=Math.round(st.thr*100)+'%';
  el.fill.style.height=(st.thr*100)+'%';
  el.trim.textContent=(st.trim>=0?'+':'')+Math.round(st.trim*100);
  el.brk.className='lamp'+(ctl.brake?' on':''); el.brk.lastElementChild.textContent=ctl.brake?'on':'off';
  el.gnd.className='lamp'+(st.onGround?' on':''); el.gnd.lastElementChild.textContent=st.onGround?'ground':'air';
  el.view.textContent=view==='chase'?'Chase':'Cockpit';
  el.gun.textContent=gunLeft; el.msl.textContent=mslLeft; el.kills.textContent=kills; el.hp.textContent=Math.max(0,Math.round(hp));
  let w='', blink=false;
  if(mode==='play'||mode==='paused'){
    if(!st.onGround&&st.alpha>0.8*A_STALL){ w='STALL'; blink=true; }
    else if(st.speed>VNE){ w='OVERSPEED'; blink=true; }
    else if(!st.onGround&&st.vel.y<-12*VNE/90&&agl<250*VNE/90){ w='PULL UP'; blink=true; }
  }
  if(w){ el.warn.hidden=false; el.warn.textContent=w; el.warn.className='warn'+(blink?' blink':''); } else el.warn.hidden=true;
}

/* ================= Main loop ================= */
const H=1/120;
let last=performance.now(), acc=0;
function resize(){
  const w=canvas.clientWidth||window.innerWidth, h=canvas.clientHeight||window.innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); sizeAI(); sizeMM(); if(mode==='menu') setMenuView(true);
}
window.addEventListener('resize',resize);
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(mode==='play'){
    readInputs(dt); acc+=dt;
    let n=0; while(acc>=H&&n<10&&mode==='play'){ step(H); acc-=H; n++; }
    if(n>=10) acc=0;
  }else if(mode==='crashed'){ updateDebris(dt); }
  for(let i=0;i<spinners.length;i++) spinners[i].rotation.y+=dt*1.6;
  if(mode!=='paused') updateTargets(dt);
  if(mode==='play'||mode==='crashed') updateWeapons(dt);
  updatePeers(dt); netTick(dt);
  syncPlane(dt); updateCamera(dt); updateLockUI(); updateHud();
  renderer.render(scene,camera);
}

setPlane(planeIdx); applyLook(); resetState('ground'); resetWeapons();
updateTerrain(Math.round(st.pos.x/CELL),Math.round(st.pos.z/CELL));
snapCamera(); resize(); showMenu();
requestAnimationFrame(function(t){last=t; frame(t);});
})();
</script>
